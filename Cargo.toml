[workspace]
resolver = "2"
members = [
    "rustrender-core",
    "rustrender-native",
    "rustrender-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NppMarkdownPanel Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
