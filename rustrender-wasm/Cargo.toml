[package]
name = "rustrender-wasm"
description = "WASM outlet of rustrender-core (route C experiment, WebView2 embedded)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "rustrender_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustrender-core = { path = "../rustrender-core", default-features = false }
wasm-bindgen = "0.2.127"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
