name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & package (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64 }
          - { target: i686-pc-windows-msvc, arch: x86 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native DLL
        run: cargo build --release -p rustrender-native --target ${{ matrix.target }}

      - name: Test (per-target, x64 + x86)
        run: cargo test --release -p rustrender-core -p rustrender-native --target ${{ matrix.target }}

      - name: Stage DLL
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/rustrender.dll "artifacts/rustrender.${{ matrix.arch }}.dll"

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install .NET Framework 4.7.2 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net472 -Version 1.0.3 -OutputDirectory tools/ra -ExcludeVersion

      - name: Install UnmanagedExports.Repack.Upgrade
        run: nuget install Unmanagedexports.Repack.Upgrade -Version 1.2.1 -OutputDirectory NppMarkdownPanel/packages

      - name: Build C# plugin
        shell: pwsh
        run: |
          $ra = (Resolve-Path "tools/ra/Microsoft.NETFramework.ReferenceAssemblies.net472/build/.NETFramework/v4.7.2").Path
          & .\NppMarkdownPanel\build.ps1 -FrameworkPathOverride $ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Mirrors the CI build.yml packaging layout exactly:
      #   main plugin     -> NppMarkdownPanel/NppMarkdownPanel/bin/Release[-x64]
      #   class libraries -> NppMarkdownPanel/<proj>/bin/Release (AnyCPU, shared)
      #   WebView2 runtimes -> NppMarkdownPanel/Webview2Viewer/bin/Release/runtimes
      - name: Stage plugin outputs
        run: |
          mkdir -p stage/NppMarkdownPanel
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cp -r NppMarkdownPanel/NppMarkdownPanel/bin/Release-x64/* stage/NppMarkdownPanel/
          else
            cp -r NppMarkdownPanel/NppMarkdownPanel/bin/Release/* stage/NppMarkdownPanel/
          fi
          for proj in MarkdigWrapper PanelCommon Webview2Viewer RustRenderWrapper; do
            cp NppMarkdownPanel/$proj/bin/Release/*.dll stage/NppMarkdownPanel/ 2>/dev/null || true
          done
          if [ -d "NppMarkdownPanel/Webview2Viewer/bin/Release/runtimes" ]; then
            cp -r NppMarkdownPanel/Webview2Viewer/bin/Release/runtimes stage/NppMarkdownPanel/
          fi
          cp artifacts/rustrender.${{ matrix.arch }}.dll stage/NppMarkdownPanel/rustrender.dll
          cp NppMarkdownPanel/NppMarkdownPanel/style.css stage/NppMarkdownPanel/ 2>/dev/null || true
          cp NppMarkdownPanel/NppMarkdownPanel/style-dark.css stage/NppMarkdownPanel/ 2>/dev/null || true
          cp NppMarkdownPanel/NppMarkdownPanel/style-themes.css stage/NppMarkdownPanel/ 2>/dev/null || true
          cp README.md stage/NppMarkdownPanel/ 2>/dev/null || true
          find stage -type f | head -40

      - name: Zip package
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path stage/NppMarkdownPanel -DestinationPath NppMarkdownPanel-rustcore-${{ matrix.arch }}.zip -Force"
          ls -la *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npp-markdown-rustcore-${{ matrix.arch }}
          path: NppMarkdownPanel-rustcore-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NppMarkdownPanel-rustcore-x64.zip
            dist/NppMarkdownPanel-rustcore-x86.zip
