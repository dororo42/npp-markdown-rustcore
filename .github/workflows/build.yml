name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust core + native DLL (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, arch: x64 }
          - { target: i686-pc-windows-msvc, arch: x86 }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native DLL
        run: cargo build --release -p rustrender-native --target ${{ matrix.target }}

      - name: Test (host target, once per matrix is fine)
        if: matrix.arch == 'x64'
        run: cargo test --release -p rustrender-core -p rustrender-native

      - name: Stage DLL
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/rustrender.dll "artifacts/rustrender.${{ matrix.arch }}.dll"
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: rustrender-windows-${{ matrix.arch }}
          path: artifacts/rustrender.${{ matrix.arch }}.dll
          if-no-files-found: error

  csharp:
    name: C# plugin (x64 + x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Install .NET Framework 4.7.2 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net472 -Version 1.0.3 -OutputDirectory tools/ra -ExcludeVersion

      - name: Install UnmanagedExports.Repack.Upgrade (imported by main csproj, missing from packages.config)
        run: nuget install Unmanagedexports.Repack.Upgrade -Version 1.2.1 -OutputDirectory NppMarkdownPanel/packages

      - name: Build x86 + x64 (plugin solution)
        shell: pwsh
        run: |
          $ra = (Resolve-Path "tools/ra/Microsoft.NETFramework.ReferenceAssemblies.net472/build/.NETFramework/v4.7.2").Path
          & .\NppMarkdownPanel\build.ps1 -FrameworkPathOverride $ra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage plugin outputs
        run: |
          mkdir -p artifacts
          cp -r NppMarkdownPanel/NppMarkdownPanel/bin/Release artifacts/plugin-x86 2>/dev/null || true
          cp -r NppMarkdownPanel/NppMarkdownPanel/bin/Release-x64 artifacts/plugin-x64 2>/dev/null || true
          # Class libraries use Private=False project references (upstream
          # makerelease.ps1 collects them manually) — do the same here.
          for proj in MarkdigWrapper PanelCommon Webview2Viewer RustRenderWrapper; do
            cp -r NppMarkdownPanel/$proj/bin/Release/*.dll artifacts/plugin-x86/ 2>/dev/null || true
            cp -r NppMarkdownPanel/$proj/bin/Release/*.dll artifacts/plugin-x64/ 2>/dev/null || true
          done
          cp -r NppMarkdownPanel/Webview2Viewer/bin/Release/runtimes artifacts/plugin-x86/ 2>/dev/null || true
          cp -r NppMarkdownPanel/Webview2Viewer/bin/Release/runtimes artifacts/plugin-x64/ 2>/dev/null || true
          find artifacts -type f | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: npp-markdown-plugin-csharp
          path: artifacts/
          if-no-files-found: error

  package:
    name: Package release layout
    runs-on: windows-latest
    needs: [rust, csharp]
    steps:
      - uses: actions/checkout@v4

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          path: downloads/

      - name: Assemble plugin packages
        run: |
          set -e
          mkdir -p dist/x64/NppMarkdownPanel dist/x86/NppMarkdownPanel

          # C# managed assemblies (x86 / x64 plugin output dirs)
          cp downloads/npp-markdown-plugin-csharp/plugin-x64/*.dll dist/x64/NppMarkdownPanel/
          cp -r downloads/npp-markdown-plugin-csharp/plugin-x64/runtimes dist/x64/NppMarkdownPanel/ 2>/dev/null || true
          cp downloads/npp-markdown-plugin-csharp/plugin-x86/*.dll dist/x86/NppMarkdownPanel/
          cp -r downloads/npp-markdown-plugin-csharp/plugin-x86/runtimes dist/x86/NppMarkdownPanel/ 2>/dev/null || true

          # Native renderer per arch
          cp downloads/rustrender-windows-x64/rustrender.x64.dll dist/x64/NppMarkdownPanel/rustrender.dll
          cp downloads/rustrender-windows-x86/rustrender.x86.dll dist/x86/NppMarkdownPanel/rustrender.dll

          # CSS themes (upstream resources)
          cp NppMarkdownPanel/NppMarkdownPanel/style.css dist/x64/NppMarkdownPanel/ 2>/dev/null || true
          cp NppMarkdownPanel/NppMarkdownPanel/style-dark.css dist/x64/NppMarkdownPanel/ 2>/dev/null || true
          cp NppMarkdownPanel/NppMarkdownPanel/style.css dist/x86/NppMarkdownPanel/ 2>/dev/null || true
          cp NppMarkdownPanel/NppMarkdownPanel/style-dark.css dist/x86/NppMarkdownPanel/ 2>/dev/null || true

          echo "--- dist/x64 ---"; find dist/x64 -type f | head -20
          echo "--- dist/x86 ---"; find dist/x86 -type f | head -20

      - name: Zip packages
        run: |
          cd dist
          # Zip root = NppMarkdownPanel\ so users can extract straight into
          # <Notepad++>\plugins\ (the plugin folder itself is inside the zip).
          powershell -NoProfile -Command "Compress-Archive -Path x64/NppMarkdownPanel -DestinationPath NppMarkdownPanel-rustcore-x64.zip -Force"
          powershell -NoProfile -Command "Compress-Archive -Path x86/NppMarkdownPanel -DestinationPath NppMarkdownPanel-rustcore-x86.zip -Force"
          ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: npp-markdown-rustcore-packages
          path: dist/*.zip
          if-no-files-found: error
